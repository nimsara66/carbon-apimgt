name: API Manager Build with Test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read # to fetch code (actions/checkout)
concurrency:
  group: ${{ github.event.number || github.run_id }}
  cancel-in-progress: true
jobs:
  build-carbon:
    runs-on: codebuild-wso2_carbon-apimgt-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Run hostname
        run: hostname
      - name: Fix host entry
        run: sudo echo "127.0.0.1 $(hostname)" | sudo tee -a /etc/hosts
      - name: Show hosts
        run: cat /etc/hosts
      - name: Checkout master
        uses: actions/checkout@v3
        with:
          fetch-depth: '10'
      - name: Set up JDK 21
        uses: actions/setup-java@v2
        with:
          java-version: 21
          distribution: 'temurin'
      - uses: actions/setup-node@v3
        with:
          node-version: '14.x'
      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2
          restore-keys: ${{ runner.os }}-m2

      - name: Build carbon-apimgt with Tests
        run: mvn clean install --file pom.xml

      # The v2 jobs build the product against exactly these unit-tested artifacts instead of rebuilding them.
      - name: Package carbon-apimgt build for the integration jobs
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "$VERSION" > carbon-apimgt-version.txt
          cd ~/.m2/repository
          tar -czf "$GITHUB_WORKSPACE/carbon-apimgt-build.tar.gz" org/wso2/carbon/apimgt/*/"$VERSION"
      - name: Upload carbon-apimgt build
        uses: actions/upload-artifact@v4
        with:
          name: carbon-apimgt-build
          path: |
            carbon-apimgt-build.tar.gz
            carbon-apimgt-version.txt
          retention-days: 3
          if-no-files-found: error
      # Only the per-module unit reports; the jacoco-aggregate reports repeat the same data.
      - name: List unit test coverage reports
        id: unit-coverage
        run: |
          files=$(find components features -path '*/target/coverage-reports/site/jacoco-ut/jacoco.xml' | sort | paste -sd, -)
          if [ -z "$files" ]; then
            echo "::error::No unit test coverage reports found."
            exit 1
          fi
          echo "files=$files" >> "$GITHUB_OUTPUT"
      - name: Upload unit test coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ${{ steps.unit-coverage.outputs.files }}
          disable_search: true
          flags: unit_tests

  # Builds the APIM distributions against this carbon-apimgt build, and the integration-v2 Docker images, once.
  # The test jobs receive the locally built images, the testcontainers staging (target/is7 and the distributed
  # image defaults, produced only by `mvn install`) and the Maven repository (run-scoped cache).
  v2-build-images:
    needs: build-carbon
    runs-on: codebuild-wso2_carbon-apimgt-${{ github.run_id }}-${{ github.run_attempt }}
    env:
      V2_DIR: product-apim/all-in-one-apim/modules/integration-v2
    steps:
      - name: Run hostname
        run: hostname
      - name: Fix host entry
        run: sudo echo "127.0.0.1 $(hostname)" | sudo tee -a /etc/hosts
      - name: Checkout Product-APIM
        uses: actions/checkout@v3
        with:
          repository: wso2/product-apim
          ref: refs/heads/master
          fetch-depth: '10'
          path: product-apim
      - name: Set up JDK 21
        uses: actions/setup-java@v2
        with:
          java-version: 21
          distribution: 'temurin'
      # product-apim pins Maven 3.6.3; newer Maven rejects the product POMs.
      - name: Set up Maven for product-apim
        uses: ./product-apim/.github/actions/setup-maven
      - name: Cache Maven repository
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: m2-v2-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-m2
      - name: Download carbon-apimgt build
        uses: actions/download-artifact@v4
        with:
          name: carbon-apimgt-build
          path: ${{ runner.temp }}/carbon-apimgt-build
      - name: Install carbon-apimgt build into the Maven repository
        run: |
          mkdir -p ~/.m2/repository
          tar -xzf "$RUNNER_TEMP/carbon-apimgt-build/carbon-apimgt-build.tar.gz" -C ~/.m2/repository
          echo "CARBON_APIMGT_VERSION=$(cat "$RUNNER_TEMP/carbon-apimgt-build/carbon-apimgt-version.txt")" >> "$GITHUB_ENV"
      - name: Resolve APIM product versions
        run: |
          echo "APIM_VERSION=$(mvn -q -f product-apim/all-in-one-apim/pom.xml help:evaluate -Dexpression=project.version -DforceStdout)" >> "$GITHUB_ENV"
          echo "CP_VERSION=$(mvn -q -f product-apim/api-control-plane/pom.xml help:evaluate -Dexpression=project.version -DforceStdout)" >> "$GITHUB_ENV"
          echo "TM_VERSION=$(mvn -q -f product-apim/traffic-manager/pom.xml help:evaluate -Dexpression=project.version -DforceStdout)" >> "$GITHUB_ENV"
          echo "GATEWAY_VERSION=$(mvn -q -f product-apim/gateway/pom.xml help:evaluate -Dexpression=project.version -DforceStdout)" >> "$GITHUB_ENV"
      - name: Build APIM distributions with this carbon-apimgt (skip tests)
        run: >
          mvn clean install --file product-apim/pom.xml
          -Dcarbon.apimgt.version="$CARBON_APIMGT_VERSION"
          -Dmaven.test.skip=true -DskipBenchMarkTest=true -DskipRestartTests=true
          -Dapim.server.version="$APIM_VERSION"
          -Ddistributed.apim.cp.image.name="distributed-apim-cp:${CP_VERSION}-jdk21"
          -Ddistributed.apim.tm.image.name="distributed-apim-tm:${TM_VERSION}-jdk21"
          -Ddistributed.apim.gateway.image.name="distributed-apim-gateway:${GATEWAY_VERSION}-jdk21"
      # The runner can itself be a container beside the Docker daemon, so host-gateway is not always the runner.
      # Docker builds reach the runner's servers (e.g. the distribution zip server on port 8000) at its own address.
      - name: Resolve runner address for Docker builds
        run: echo "DOCKER_EXTRA_HOSTS=--add-host=host.docker.internal:$(hostname -I | awk '{print $1}')" >> "$GITHUB_ENV"
      - name: Build integration Docker images (no suite)
        working-directory: ${{ env.V2_DIR }}
        run: >
          mvn install -Pinclude-distributed-images -pl tests-integration/cucumber-tests -am -DskipTests
          -Dapim.server.version="$APIM_VERSION"
          -Ddistributed.apim.cp.image.name="distributed-apim-cp:${CP_VERSION}-jdk21"
          -Ddistributed.apim.tm.image.name="distributed-apim-tm:${TM_VERSION}-jdk21"
          -Ddistributed.apim.gateway.image.name="distributed-apim-gateway:${GATEWAY_VERSION}-jdk21"
          -Ddocker.extra.hosts="$DOCKER_EXTRA_HOSTS"
      - name: Resolve Docker image names
        working-directory: ${{ env.V2_DIR }}
        run: |
          echo "APIM_IMAGE=$(mvn -q -N help:evaluate -Dexpression=apim.docker.image.name -Dapim.server.version="$APIM_VERSION" -DforceStdout)" >> "$GITHUB_ENV"
          echo "SOLACE_SHIM_IMAGE=$(mvn -q -N help:evaluate -Dexpression=solace.shim.docker.image.name -DforceStdout)" >> "$GITHUB_ENV"
          echo "SQUID_IMAGE=$(mvn -q -N help:evaluate -Dexpression=squid.docker.image.name -DforceStdout)" >> "$GITHUB_ENV"
      # Only locally built images travel by tar; public images are pulled by the test jobs.
      - name: Save Docker images and staging
        run: |
          mkdir -p "$RUNNER_TEMP/v2-images"
          docker save \
            "$APIM_IMAGE" \
            "distributed-apim-cp:${CP_VERSION}-jdk21" \
            "distributed-apim-tm:${TM_VERSION}-jdk21" \
            "distributed-apim-gateway:${GATEWAY_VERSION}-jdk21" \
            node-app-server:latest \
            "$SOLACE_SHIM_IMAGE" \
            "$SQUID_IMAGE" | gzip > "$RUNNER_TEMP/v2-images/images.tar.gz"
          tar -C "$V2_DIR/tests-common/testcontainers/target" -czf "$RUNNER_TEMP/v2-images/is7-staging.tar.gz" is7
          tar -C "$V2_DIR/tests-common/testcontainers/target" -czf \
            "$RUNNER_TEMP/v2-images/distributed-apim-staging.tar.gz" distributed-apim/defaults
      - name: Upload Docker images and staging
        uses: actions/upload-artifact@v4
        with:
          name: v2-images
          path: ${{ runner.temp }}/v2-images/
          retention-days: 3
          if-no-files-found: error

  # Runs the product-apim integration-v2 suite against this carbon-apimgt build: the all-in-one and distributed
  # suites, each split into two jobs by the blocks' group parameter. The steps follow the product-apim
  # integration-v2 jobs (.github/workflows/maven.yml).
  build-product:
    needs: v2-build-images
    runs-on: codebuild-wso2_carbon-apimgt-${{ github.run_id }}-${{ github.run_attempt }}
    strategy:
      matrix:
        include:
          - id: v2-all-in-one-group1
            suite: testng-v2.xml
            group: group1
            coverage: true
            topology: all-in-one
          - id: v2-all-in-one-group2
            suite: testng-v2.xml
            group: group2
            coverage: true
            topology: all-in-one
          - id: v2-distributed-group1
            suite: testng-v2_distributed.xml
            group: group1
            coverage: false
            topology: distributed
          - id: v2-distributed-group2
            suite: testng-v2_distributed.xml
            group: group2
            coverage: false
            topology: distributed
      fail-fast: false
    env:
      V2_DIR: product-apim/all-in-one-apim/modules/integration-v2
      V2_RESOURCES: product-apim/all-in-one-apim/modules/integration-v2/tests-integration/cucumber-tests/src/test/resources
    steps:
      - name: Run hostname
        run: hostname
      - name: Fix host entry
        run: sudo echo "127.0.0.1 $(hostname)" | sudo tee -a /etc/hosts
      - name: Show hosts
        run: cat /etc/hosts
      # carbon-apimgt sources let Codecov map the integration coverage report onto this repository.
      - name: Checkout master
        uses: actions/checkout@v3
        with:
          fetch-depth: '10'
      - name: Checkout Product-APIM
        uses: actions/checkout@v3
        with:
          repository: wso2/product-apim
          ref: refs/heads/master
          fetch-depth: '10'
          path: product-apim
      - name: Set up JDK 21
        uses: actions/setup-java@v2
        with:
          java-version: 21
          distribution: 'temurin'
      - name: Set up Maven for product-apim
        uses: ./product-apim/.github/actions/setup-maven
      - name: Restore Maven repository
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: m2-v2-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-m2
      - name: Download Docker images and staging
        uses: actions/download-artifact@v4
        with:
          name: v2-images
          path: ${{ runner.temp }}/v2-images
      - name: Load Docker images
        run: docker load < "$RUNNER_TEMP/v2-images/images.tar.gz"
      - name: Resolve APIM product versions
        run: |
          echo "APIM_VERSION=$(mvn -q -f product-apim/all-in-one-apim/pom.xml help:evaluate -Dexpression=project.version -DforceStdout)" >> "$GITHUB_ENV"
          echo "CP_VERSION=$(mvn -q -f product-apim/api-control-plane/pom.xml help:evaluate -Dexpression=project.version -DforceStdout)" >> "$GITHUB_ENV"
          echo "TM_VERSION=$(mvn -q -f product-apim/traffic-manager/pom.xml help:evaluate -Dexpression=project.version -DforceStdout)" >> "$GITHUB_ENV"
          echo "GATEWAY_VERSION=$(mvn -q -f product-apim/gateway/pom.xml help:evaluate -Dexpression=project.version -DforceStdout)" >> "$GITHUB_ENV"
      # `mvn test` never runs the pre-integration-test executions, so the suite reads the image build's staging.
      - name: Restore testcontainers staging (target/is7, distributed image defaults)
        run: |
          mkdir -p "$V2_DIR/tests-common/testcontainers/target"
          tar -C "$V2_DIR/tests-common/testcontainers/target" -xzf "$RUNNER_TEMP/v2-images/is7-staging.tar.gz"
          tar -C "$V2_DIR/tests-common/testcontainers/target" -xzf "$RUNNER_TEMP/v2-images/distributed-apim-staging.tar.gz"
      - name: Resolve runner address for host.docker.internal
        run: echo "DOCKER_EXTRA_HOSTS=--add-host=host.docker.internal:$(hostname -I | awk '{print $1}')" >> "$GITHUB_ENV"
      # The coverage report is built from the class files of the image that ran, so JaCoCo class ids match.
      - name: Extract APIM class files from image (for coverage report)
        if: matrix.coverage
        working-directory: ${{ env.V2_DIR }}
        run: |
          APIM_IMAGE=$(mvn -q -N help:evaluate -Dexpression=apim.docker.image.name -Dapim.server.version="$APIM_VERSION" -DforceStdout)
          APIM_SERVER_NAME=$(mvn -q -N help:evaluate -Dexpression=apim.server.name -DforceStdout)
          SRC="$RUNNER_TEMP/cov-classfiles"
          mkdir -p "$SRC"
          cid=$(docker create "$APIM_IMAGE")
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          BASE="/home/wso2carbon/$APIM_SERVER_NAME/repository"
          docker cp "$cid:$BASE/components/plugins"        "$SRC/plugins"
          docker cp "$cid:$BASE/deployment/server/webapps" "$SRC/webapps"
          echo "APIM_COVERAGE_CLASSFILES=$SRC" >> "$GITHUB_ENV"
      - name: Prepare distributed memory and swap budget
        if: matrix.topology == 'distributed'
        run: sudo bash "$V2_RESOURCES/distributed-memory-budget/setup-distributed-memory-budget.sh" setup "$RUNNER_TEMP/apim-distributed-memory-budget"
      - name: Create browser cgroup
        env:
          BROWSER_CGROUP_PATH: ${{ matrix.topology == 'distributed' && '/sys/fs/cgroup/apimdistributed.slice/apimdistributed-browser.service' || '/sys/fs/cgroup/pw-browser' }}
          BROWSER_MEMORY_LIMIT_BYTES: ${{ matrix.topology == 'distributed' && '536870912' || '2684354560' }}
          BROWSER_SWAP_LIMIT_BYTES: ${{ matrix.topology == 'distributed' && '134217728' || '0' }}
        run: sudo bash "$V2_RESOURCES/browser-cgroup/setup-browser-cgroup.sh" "$BROWSER_CGROUP_PATH" "$BROWSER_MEMORY_LIMIT_BYTES" "$BROWSER_SWAP_LIMIT_BYTES"
      - name: Configure browser network isolation
        run: |
          sudo apt-get update
          sudo apt-get install -y socat iproute2
          sudo bash "$V2_RESOURCES/browser-cgroup/setup-browser-network.sh"
      - name: Prepare host clock for integration-v2
        run: |
          sudo apt-get install -y chrony
          CLOCK_LOG_DIR="$GITHUB_WORKSPACE/$V2_DIR/tests-integration/cucumber-tests/target/logs/host-clock/preparation"
          mkdir -p "$CLOCK_LOG_DIR"
          sudo bash "$V2_RESOURCES/host-clock/prepare-test-clock.sh" prepare "$CLOCK_LOG_DIR"
          echo "APIM_CLOCK_PREPARED_FILE=$CLOCK_LOG_DIR/prepared.json" >> "$GITHUB_ENV"
      # `mvn test` (not install) uses the loaded images and restored staging instead of rebuilding them.
      - name: Run all-in-one integration-v2 suite
        if: matrix.topology == 'all-in-one'
        working-directory: ${{ env.V2_DIR }}
        run: >
          python3 tests-integration/cucumber-tests/src/test/resources/host-diagnostics/run-with-host-diagnostics.py
          --output tests-integration/cucumber-tests/target/logs/host-diagnostics --
          mvn test -pl tests-integration/cucumber-tests -am
          -Dsurefire.suite.xml=${{ matrix.suite }}
          -Dapim.v2.test.groups=${{ matrix.group }}
          -Dapim.server.version="$APIM_VERSION"
          -Ddistributed.apim.cp.image.name="distributed-apim-cp:${CP_VERSION}-jdk21"
          -Ddistributed.apim.tm.image.name="distributed-apim-tm:${TM_VERSION}-jdk21"
          -Ddistributed.apim.gateway.image.name="distributed-apim-gateway:${GATEWAY_VERSION}-jdk21"
          -Dplaywright.sso=true
          -Dapim.coverage=true
          -Dapim.coverage.classfiles="$APIM_COVERAGE_CLASSFILES"
          -Dapim.clock.prepared.file="$APIM_CLOCK_PREPARED_FILE"
          -Ddocker.extra.hosts="$DOCKER_EXTRA_HOSTS"
      - name: Run distributed integration-v2 suite (coverage intentionally disabled)
        if: matrix.topology == 'distributed'
        working-directory: ${{ env.V2_DIR }}
        run: |
          SUITE_USER="$(id -un)"
          SUITE_NOFILE_LIMIT="$(ulimit -Sn):$(ulimit -Hn)"
          sudo -E systemd-run --scope --slice=apimdistributed.slice --unit=apim-distributed-suite \
            --working-directory="$GITHUB_WORKSPACE/$V2_DIR" -- \
            prlimit --nofile="$SUITE_NOFILE_LIMIT" -- \
            setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups -- \
            env HOME="$HOME" PATH="$PATH" JAVA_HOME="$JAVA_HOME" USER="$SUITE_USER" LOGNAME="$SUITE_USER" \
            python3 tests-integration/cucumber-tests/src/test/resources/host-diagnostics/run-with-host-diagnostics.py \
              --output tests-integration/cucumber-tests/target/logs/host-diagnostics -- \
              mvn test -pl tests-integration/cucumber-tests -am \
                -Dsurefire.suite.xml=${{ matrix.suite }} \
                -Dapim.v2.test.groups=${{ matrix.group }} \
                -Dapim.server.version="$APIM_VERSION" \
                -Ddistributed.apim.cp.image.name="distributed-apim-cp:${CP_VERSION}-jdk21" \
                -Ddistributed.apim.tm.image.name="distributed-apim-tm:${TM_VERSION}-jdk21" \
                -Ddistributed.apim.gateway.image.name="distributed-apim-gateway:${GATEWAY_VERSION}-jdk21" \
                -Dplaywright.sso=true \
                -Dplaywright.browser.cgroup=/sys/fs/cgroup/apimdistributed.slice/apimdistributed-browser.service \
                -Dapim.clock.prepared.file="$APIM_CLOCK_PREPARED_FILE" \
                -Ddocker.extra.hosts="$DOCKER_EXTRA_HOSTS"
      - name: Stop host diagnostics collector
        if: always()
        working-directory: ${{ env.V2_DIR }}
        run: >
          python3 tests-integration/cucumber-tests/src/test/resources/host-diagnostics/run-with-host-diagnostics.py
          --output tests-integration/cucumber-tests/target/logs/host-diagnostics --stop
      - name: Restore Docker and host swap configuration
        if: always() && matrix.topology == 'distributed'
        run: sudo bash "$V2_RESOURCES/distributed-memory-budget/setup-distributed-memory-budget.sh" cleanup "$RUNNER_TEMP/apim-distributed-memory-budget"
      - name: Archive test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-v2-reports-${{ matrix.id }}
          path: |
            ${{ env.V2_DIR }}/tests-integration/cucumber-tests/target/surefire-reports/**
            ${{ env.V2_DIR }}/tests-integration/cucumber-tests/target/block-timeline.json
            ${{ env.V2_DIR }}/tests-integration/cucumber-tests/target/cucumber-report/**
            ${{ env.V2_DIR }}/tests-integration/cucumber-tests/target/logs/**
            ${{ env.V2_DIR }}/tests-integration/cucumber-tests/target/coverage/output/**
          if-no-files-found: warn
      # A partial report would upload without error, so the report and every block's coverage dump are checked first.
      - name: Verify coverage report was generated
        if: matrix.coverage
        run: |
          REPORT=$V2_DIR/tests-integration/cucumber-tests/target/coverage/output/txt/jacoco-it.xml
          if [ ! -s "$REPORT" ] || ! grep -q '<counter type="LINE"' "$REPORT"; then
            echo "::error::Coverage report missing, empty, or malformed at $REPORT."
            exit 1
          fi
          echo "Coverage report present and valid ($(wc -c <"$REPORT") bytes)"
          SUMMARY=$V2_DIR/tests-integration/cucumber-tests/target/coverage/output/txt/coverage-summary.properties
          if [ ! -s "$SUMMARY" ]; then
            echo "::error::Coverage dump summary missing at $SUMMARY; cannot confirm every block was dumped."
            exit 1
          fi
          expected=$(sed -n 's/^blocks\.expected=//p' "$SUMMARY")
          dumped=$(sed -n 's/^blocks\.dumped=//p' "$SUMMARY")
          missing=$(sed -n 's/^blocks\.missing=//p' "$SUMMARY")
          restarts=$(sed -n 's/^restart\.dumps=//p' "$SUMMARY")
          if [ -z "$expected" ] || [ "$expected" != "$dumped" ] || [ -n "$missing" ]; then
            echo "::error::Coverage dumped ${dumped:-?} of ${expected:-?} blocks; missing: ${missing:-unknown}."
            exit 1
          fi
          failedRestarts=$(sed -n 's/^restart\.dumps\.failed=//p' "$SUMMARY")
          failedRestartList=$(sed -n 's/^restart\.dumps\.failedList=//p' "$SUMMARY")
          if [ "$failedRestarts" != "0" ]; then
            echo "::error::Coverage lost ${failedRestarts:-an unknown number of} pre-restart dump(s): ${failedRestartList:-unknown}."
            exit 1
          fi
          echo "Coverage dumps: $dumped/$expected blocks, $restarts pre-restart dump(s)"
      - name: Upload integration test coverage to Codecov
        if: ${{ always() && matrix.coverage }}
        uses: codecov/codecov-action@v7
        with:
          files: ${{ env.V2_DIR }}/tests-integration/cucumber-tests/target/coverage/output/txt/jacoco-it.xml
          disable_search: true
          flags: integration_tests
      - name: Publish Test Report
        if: always()
        uses: ScalableCapital/action-surefire-report@v2
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        with:
          report_paths: '${{ env.V2_DIR }}/tests-integration/cucumber-tests/target/surefire-reports/TEST-*.xml'
          report_mode: workflow
          fail_on_test_failures: false
          fail_if_no_tests: true
          check_name: 'integration-v2 results (${{ matrix.id }})'
  run-benchmark-test:
    runs-on: codebuild-wso2_carbon-apimgt-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Run hostname
        run: hostname
      - name: Fix host entry
        run: sudo echo "127.0.0.1 $(hostname)" | sudo tee -a /etc/hosts
      - name: Show hosts
        run: cat /etc/hosts
      - name: Checkout master
        uses: actions/checkout@v3
        with:
          fetch-depth: '10'
      - name: Set up JDK 21
        uses: actions/setup-java@v2
        with:
          java-version: 21
          distribution: 'temurin'
      - uses: actions/setup-node@v3
        with:
          node-version: '14.x'
      - name: Cache maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2
          restore-keys: ${{ runner.os }}-m2
      - name: Build carbon-apimgt without tests, skip portal builds
        run: mvn clean install --file pom.xml -Dmaven.test.skip=true -Dnpm.build.skip=true
      - name: Get carbon.apimgt.version
        run: mvn help:evaluate -Dexpression=project.version -q -DforceStdout > ../CARBON_APIMGT_VERSION_FILE
      - name: Print carbon.apimgt.version
        run: |
          echo $(cat ../CARBON_APIMGT_VERSION_FILE)
      - name: Checkout Product-APIM
        uses: actions/checkout@v3
        with:
          repository: wso2/product-apim
          ref: refs/heads/master
          fetch-depth: '10'
          path: product-apim
      - name: Build product-apim with tests
        run: mvn clean install -Dcarbon.apimgt.version=$(cat ../CARBON_APIMGT_VERSION_FILE) -fae --file product-apim/all-in-one-apim/pom.xml -DskipIntegrationTests
